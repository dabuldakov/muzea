build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 120
  LongParameterList:
    active: false
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 30
    thresholdInEnums: 10
  NestedBlockDepth:
    active: true
    threshold: 4

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true

potential-bugs:
  active: true

naming:
  FunctionNaming:
    active: false
  VariableNaming:
    active: false
